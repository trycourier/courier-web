name: Release

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

# id-token is required for OIDC
# See https://docs.npmjs.com/trusted-publishers
permissions:
  contents: write # to create release (changesets/action)
  issues: write # to post issue comments (changesets/action)
  pull-requests: write # to create pull request (changesets/action)
  id-token: write # to use OpenID Connect token for provenance (changesets/action)

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'

      # OIDC requires npm 11.5.1 or later, so this can't go below 11.5.1 — and it
      # can't go to 12 either. npm 12 changed `npm info <pkg> --json` to always
      # return an array, while @changesets/cli 2.x reads `.versions` off the
      # top-level object. On npm 12 that read is `undefined`, so changesets
      # concludes every package is unpublished, re-attempts all ten on every run,
      # and collects ten `cannot publish over the previously published versions`
      # errors — which is how a Release run became permanently red and stopped
      # meaning anything. Unpin when @changesets/cli is on 3.x, which unwraps the
      # array (see parseInfoResult in dist/getPublishPlan.mjs).
      - name: Update npm
        run: npm install -g npm@11

      - name: Install Dependencies
        run: yarn install --frozen-lockfile

      - name: Update Release PR or Release to NPM
        id: changesets
        uses: changesets/action@v1
        with:
          publish: yarn release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Workaround for changesets setting NPM_TOKEN in the registry URL
          # https://github.com/changesets/changesets/issues/1152#issuecomment-3190884868
          NPM_TOKEN: ''

      # `changeset publish` reports what it attempted. This reports what npm
      # actually serves, which is not the same thing: in #257 a tarball uploaded
      # while the packument write did not, leaving a version that resolves for
      # nobody. Runs even when the step above failed — a half-finished publish is
      # precisely the case worth knowing about.
      - name: Verify the registry serves this commit
        id: verify
        if: always()
        env:
          # `changesets/action` leaves `changeset version`'s bumps in the working
          # tree on the Version Packages path, so read the versions this commit
          # actually claims rather than the ones it is proposing.
          VERIFY_REF: HEAD
          VERIFY_REPORT_PATH: ${{ runner.temp }}/release-verification.md
        run: ./scripts/verify-published.mjs

      # A failed Release run notifies nobody, and this one exits non-zero often
      # enough that its red is easy to wave off. An issue is harder to miss.
      - name: Open an issue for a broken release
        if: always() && steps.verify.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPORT: ${{ runner.temp }}/release-verification.md
        run: |
          body="$(cat "$REPORT")

          Commit: ${GITHUB_SHA}
          Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          existing="$(gh issue list --state open --limit 1 \
            --search 'Release verification failed in:title' \
            --json number --jq '.[0].number')"

          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create \
              --title "Release verification failed on ${GITHUB_SHA:0:7}" \
              --body "$body"
          fi
