<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>web-js</title>
  <link rel="stylesheet" href="../styles.css">
</head>

<body>
  <style>
    .tracking-log {
      position: fixed;
      right: 16px;
      bottom: 16px;
      width: 320px;
      max-height: 50vh;
      overflow-y: auto;
      padding: 12px 16px;
      border-radius: 4px;
      background: #1f2937;
      color: #e5e7eb;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 12px;
      line-height: 1.6;
    }

    .tracking-log strong {
      display: block;
      margin-bottom: 8px;
      color: white;
    }

    .tracking-log .opened {
      color: #93c5fd;
    }

    .tracking-log .clicked {
      color: #86efac;
    }
  </style>

  <!--
    Deliberately no `onMessageClick` handler and no `message-click` attribute: click and open
    tracking have to fire on their own. Scroll a message into view to see an `opened` event,
    click a message to see a `clicked` event.
  -->
  <courier-inbox height="60vh"></courier-inbox>

  <aside class="tracking-log">
    <strong>Tracking events</strong>
    <div id="log">Waiting…</div>
  </aside>

  <script type="module">
    import { Courier } from '@trycourier/courier-ui-inbox';

    // Log the tracking mutations the inbox sends, so both events are visible without devtools.
    const log = document.getElementById('log');
    const originalFetch = window.fetch;
    window.fetch = async (input, init) => {
      const body = typeof init?.body === 'string' ? init.body : '';
      for (const event of ['opened', 'clicked']) {
        if (body.includes(`${event}(messageId`)) {
          const count = (body.match(new RegExp(`${event}\\(messageId`, 'g')) ?? []).length;
          const line = document.createElement('div');
          line.className = event;
          line.textContent = `${new Date().toLocaleTimeString()}  ${event} × ${count}`;
          if (log.textContent === 'Waiting…') log.textContent = '';
          log.prepend(line);
        }
      }
      return originalFetch(input, init);
    };

    // Authenticate the user with the inbox
    Courier.shared.signIn({
      userId: import.meta.env.VITE_USER_ID,
      jwt: import.meta.env.VITE_JWT
    });
  </script>

</body>

</html>
